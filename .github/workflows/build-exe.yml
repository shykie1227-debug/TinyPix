name: build-exe

# Builds the TinyPix 4.0 WinUI 3 desktop app on a Windows runner and uploads two
# downloadable artifacts:
#   TinyPix-win-x64-portable      - the formal self-contained folder / ZIP
#   TinyPix-win-x64-single-file   - the optional single TinyPix.exe
# TinyPix.App targets net10.0-windows + WinUI + WindowsAppSDK. Its XAML compiler
# only runs on Windows, so macOS/Linux cannot produce the exe - this CI is the
# "push and get the exe" path.

on:
  workflow_dispatch:
    inputs:
      skip-ffmpeg:
        description: 'Skip downloading the LGPL FFmpeg engine (faster, video tools unusable)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      # NOTE: do NOT add `dotnet workload install microsoft-windows-appsdk`.
      # That workload id does not exist in the SDK manifests (the step used to
      # fail with "Workload ID microsoft-windows-appsdk is not recognized", and
      # `|| echo` did not mask it because Write-Output never resets
      # $LASTEXITCODE). WindowsAppSDK arrives as NuGet packages
      # (Microsoft.WindowsAppSDK.WinUI / .Runtime), so no workload is needed.

      - name: Restore solution
        run: dotnet restore TinyPix.sln --locked-mode

      - name: Build solution
        run: dotnet build TinyPix.sln -c Release

      - name: Test portable class libraries
        # App.Tests is intentionally excluded: it has no test files yet, and
        # `dotnet test` fails when a project contributes zero tests.
        shell: pwsh
        run: |
          foreach ($p in 'Core','Media','Infrastructure') {
            dotnet test "tests/TinyPix.$p.Tests/TinyPix.$p.Tests.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: LGPL encoder gate
        # DEPENDENCY-BASELINE.md §6: any libx264 / libx265 / libfdk-aac usage in
        # *code* is a release blocker. Fail fast before spending time on publish.
        # Documentation comments may name the banned encoders while explaining the
        # rule, so comment-only lines are skipped - the gate is about what the
        # compiler emits into FFmpeg arguments, not about prose.
        shell: pwsh
        run: |
          $pattern = 'libx264|libx265|libfdk'
          $hits = @()
          foreach ($file in Get-ChildItem src/TinyPix.Media -Recurse -Filter *.cs) {
            $lines = Get-Content -LiteralPath $file.FullName
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $trimmed = $lines[$i].Trim()
              if ($trimmed.StartsWith('//') -or $trimmed.StartsWith('*') -or $trimmed.StartsWith('/*')) {
                continue
              }
              if ($trimmed -match $pattern) {
                $hits += "$($file.Name):$($i + 1)"
              }
            }
          }
          if ($hits.Count -gt 0) {
            Write-Error "GPL/nonfree encoder referenced: $($hits -join ', ')"
            exit 1
          }
          Write-Host 'No GPL/nonfree encoder referenced in TinyPix.Media.'

      - name: Publish portable folder
        if: ${{ !inputs.skip-ffmpeg }}
        shell: pwsh
        run: ./build/publish-portable.ps1

      - name: Publish portable folder (no engine)
        if: ${{ inputs.skip-ffmpeg }}
        shell: pwsh
        run: ./build/publish-portable.ps1 -SkipFfmpeg

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ inputs.skip-ffmpeg }}' -eq 'true') { $extra += '-SkipFfmpeg' }
          ./build/Publish-SingleFile.ps1 @extra

      - name: Report artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Include *.zip,*.exe -Recurse -File |
            Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TinyPix-win-x64-portable
          path: artifacts/TinyPix-4.0-Windows-x64-Portable.zip
          if-no-files-found: error

      - name: Upload single-file exe
        uses: actions/upload-artifact@v4
        with:
          name: TinyPix-win-x64-single-file
          path: artifacts/TinyPix-single-file
          if-no-files-found: error
