name: build-exe

# Builds the TinyPix 4.0 WinUI 3 desktop app on a Windows runner and uploads the
# self-contained win-x64 folder (contains TinyPix.exe) as a downloadable artifact.
# TinyPix.App targets net10.0-windows + WinUI + WindowsAppSDK, so it can only be
# built on Windows — this CI is the easiest "push and get the exe" path.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Add Windows App SDK workload (best-effort)
        # On windows-latest the workload may already be present via VS; the
        # `|| echo` keeps the job from hard-failing if the id/version differs.
        run: |
          dotnet workload install microsoft-windows-appsdk `
            || echo "workload install skipped/failed (may already be present or id changed)"

      - name: Restore
        run: dotnet restore src/TinyPix.App/TinyPix.App.csproj

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/TinyPix.App/TinyPix.App.csproj
          -c Release -r win-x64 --self-contained true -o artifacts/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyPix-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
